name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Required files are present
        run: |
          missing=0
          for f in README.md CHANGELOG.md CLAUDE.md .gitignore; do
            if [ ! -f "$f" ]; then
              echo "::error::missing required file: $f"
              missing=1
            fi
          done
          exit $missing

      - name: Changelog has an Unreleased section
        run: |
          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [Unreleased]' section"
            exit 1
          fi

      - name: Relative links in Markdown resolve
        run: .github/scripts/check-md-links.sh

      - name: Link checker behaviour on sample trees
        run: tests/check-md-links.test.sh

  hook:
    name: pre-commit hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: >
          shellcheck .githooks/pre-commit tests/pre-commit.test.sh
          .github/scripts/check-md-links.sh tests/check-md-links.test.sh

      - name: Hook behaviour in throwaway repos
        run: tests/pre-commit.test.sh
